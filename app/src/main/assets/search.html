<div id="page-search" class="page">
  <div class="disabled-section" id="searchCard">
    <div class="search-bar-container">
      <div class="search-input-row">
        <input type="text" id="searchInput" class="input-box" placeholder="Теги, авторы или ID..." enterkeyhint="search" oninput="toggleSearchClear()" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); event.target.blur(); startSearch(true); }">
        <div id="searchClearBtn" class="search-clear-btn" onclick="clearSearchInput()"><svg class="icon-sm"><use xlink:href="#icon-close"></use></svg></div>
        <div style="color: var(--pixiv-blue); cursor: pointer; padding: 8px;" onclick="startSearch(true)"><svg class="icon"><use xlink:href="#icon-search"></use></svg></div>
      </div>

      <div class="filter-container" style="display: flex; align-items: center; width: 100%; gap: 8px;">
        <div class="theme-segmented" style="margin-top: 0; padding: 2px; flex-shrink: 0; border-radius: 20px; position: relative;">
          <div class="search-mode-slider" id="searchModeSlider"></div>
          <div class="theme-segment active" id="searchMode_illust" onclick="setSearchMode('illust')" style="padding: 6px 12px; font-size: 12px; border-radius: 18px; position: relative; z-index: 1;">Арты</div>
          <div class="theme-segment" id="searchMode_user" onclick="setSearchMode('user')" style="padding: 6px 12px; font-size: 12px; border-radius: 18px; position: relative; z-index: 1;">Авторы</div>
        </div>

        <div id="activeSearchFilters" style="flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center;"></div>

        <div class="action-icon" id="openFilterBtn" onclick="toggleSearchFiltersPanel()" style="flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
        </div>
      </div>

      <div id="expandableFiltersPanel" class="expandable-panel">
        <div class="expandable-panel-inner">
          <div class="text-sub" style="margin-bottom: 8px;">Возрастной рейтинг:</div>
          <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
            <div class="chip active" id="panelAge_all" onclick="setSearchAge('all')">Все работы</div>
            <div class="chip" id="panelAge_g" onclick="setSearchAge('g')">Safe</div>
            <div class="chip" id="panelAge_r18" onclick="setSearchAge('r18')">Только R-18</div>
            <div class="chip" id="panelAge_r18g" onclick="setSearchAge('r18g')">Только R-18G</div>
          </div>

          <div class="text-sub" style="margin-bottom: 8px;">Нейросети:</div>
          <div class="chip" id="panelAiToggle" onclick="toggleSearchAi()" style="width: fit-content; margin-bottom: 16px;">Скрывать AI-арты</div>

          <div class="exclude-block">
            <div class="exclude-head">
              <svg class="icon-xs"><use href="#icon-close" xlink:href="#icon-close"></use></svg>
              Исключить теги <span class="exclude-hint">— добавляйте по одному</span>
            </div>
            <div class="exclude-input-row">
              <input type="text" id="excludeTagInput" class="exclude-input" placeholder="Например: AI, yaoi…"
                oninput="triggerAutocomplete('excludeTagInput')"
                onfocus="triggerAutocomplete('excludeTagInput')"
                onblur="setTimeout(() => { let el = document.getElementById('excludeAutocompleteSection'); if(el) el.style.display = 'none'; }, 200)"
                onkeypress="if(event.key === 'Enter') applyExcludeTags()">
              <button class="exclude-add-btn" onclick="applyExcludeTags()" aria-label="Добавить">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <div id="excludeAutocompleteSection" class="exclude-autocomplete"></div>
            <div id="excludeTagsHistoryList" class="exclude-chips"></div>
            <div class="exclude-apply-row">
              <button class="exclude-apply-btn" onclick="applyExcludeTags(); toggleSearchFiltersPanel(); startSearch(true);">Применить</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title" id="searchStatus">Введите запрос</div>
    <div class="search-grid" id="searchGrid"></div>
    <div style="padding: 16px;"><button id="loadMoreBtn" class="btn-secondary" style="display: none;" onclick="loadMore()">Загрузить ещё</button></div>
  </div>
</div>
