<style>
    /* --- Всплывающее окно (Snackbar) --- */
    #anonSnackbar {
        position: fixed;
        /* По умолчанию прячем снизу */
        bottom: -120px; 
        top: auto;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        /* Анимируем и верх, и низ, чтобы переход был плавным в обоих режимах */
        transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #anonSnackbar.show {
        bottom: 24px; /* Выезжает снизу */
    }

    /* === ЕСЛИ ВКЛЮЧЕНО НИЖНЕЕ МЕНЮ -> ОПОВЕЩЕНИЕ ВЫЕЗЖАЕТ СВЕРХУ === */
    body.nav-bottom #anonSnackbar {
        bottom: auto !important; /* Полностью отвязываем от нижнего края */
        top: -120px; /* Прячем за верхним краем экрана */
    }
    body.nav-bottom #anonSnackbar.show {
        top: calc(24px + var(--sat)) !important; /* Выезжает сверху под статус-бар */
    }

    .anon-snack-content {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
    }
    .anon-snack-text {
        flex: 1;
        overflow: hidden;
    }
    .anon-snack-title {
        font-weight: bold;
        font-size: 14px;
        color: var(--text);
        margin-bottom: 2px;
    }
    .anon-snack-desc {
        font-size: 12px;
        color: var(--subtext);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .anon-snack-btn {
        font-size: 13px;
        color: var(--pixiv-blue);
        font-weight: bold;
        padding: 6px 12px;
        background: rgba(0, 150, 250, 0.1);
        border-radius: 5px;
        white-space: nowrap;
    }
    
    /* Анимация полоски таймера */
    .anon-timer-track {
        width: 100%;
        height: 3px;
        background: var(--bg);
    }
    .anon-timer-fill {
        height: 100%;
        width: 100%;
        background: var(--pixiv-blue);
        transform-origin: left;
        /* Переход задается через JS */
    }

    /* --- Окно по центру (Modal) --- */
    #anonModalOverlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        z-index: 10001;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #anonModalOverlay.show {
        opacity: 1;
        pointer-events: auto;
    }
    #anonModal {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: 85%;
        max-width: 340px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 10002;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex;
        flex-direction: column;
    }
    #anonModal.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
    }
    .anon-modal-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        font-weight: bold;
        font-size: 16px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .anon-modal-body {
        padding: 16px;
        font-size: 14px;
        color: var(--subtext);
        line-height: 1.5;
        max-height: 60vh;
        overflow-y: auto;
    }
    .anon-modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: stretch;
    }
    .anon-modal-close {
        flex: 1;
        padding: 12px;
        background: var(--pixiv-blue);
        color: #fff;
        text-align: center;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }
</style>

<div id="anonSnackbar" onclick="openAnonModal()">
  <div class="anon-snack-content">
    <svg style="width: 24px; height: 24px; color: var(--pixiv-blue); flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>

    <div class="anon-snack-text">
      <div class="anon-snack-title" id="anonSnackTitle">Оповещение</div>
      <div class="anon-snack-desc" id="anonSnackDesc">...</div>
    </div>
    <div class="anon-snack-btn">Открыть</div>
  </div>
  <div class="anon-timer-track">
    <div class="anon-timer-fill" id="anonSnackTimer"></div>
  </div>
</div>

<div id="anonModalOverlay" onclick="closeAnonModal()"></div>
<div id="anonModal">
  <div class="anon-modal-header">
    <svg style="width: 20px; height: 20px; color: var(--pixiv-blue);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <span id="anonModalTitle">Оповещение</span>
  </div>
  <div class="anon-modal-body" id="anonModalBody">...</div>
  <div class="anon-modal-footer">
    <div class="anon-modal-close" onclick="closeAnonModal()">Понятно</div>
  </div>
</div>
